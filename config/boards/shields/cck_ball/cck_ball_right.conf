CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y

# CPI 800 com divisor 1. O divisor e aplicado como divisao INTEIRA sobre o
# valor bruto (pmw3610.c:629), entao com divisor 2 todo deslocamento bruto
# de 0 ou 1 virava zero - 69% das leituras eram descartadas em movimento
# lento. Medido por log.
CONFIG_PMW3610_CPI=800
CONFIG_PMW3610_CPI_DIVIDOR=1

# Orientacao confirmada por teste: o sensor esta montado girado 90 graus.
CONFIG_PMW3610_ORIENTATION_270=y
CONFIG_PMW3610_INVERT_X=y

CONFIG_PMW3610_SNIPE_CPI=200
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1
CONFIG_PMW3610_SCROLL_TICK=70

# 250Hz por interrupcao, o padrao do driver (antes: polling por software)
CONFIG_PMW3610_POLLING_RATE_250=y
CONFIG_PMW3610_FORCE_AWAKE=y
CONFIG_PMW3610_SMART_ALGORITHM=n

# Acumula o deslocamento e reporta a cada 10ms em vez de a cada leitura,
# reduzindo de 250 para 100 pacotes por segundo sem perder movimento.
CONFIG_PMW3610_REPORT_INTERVAL_MIN=10
