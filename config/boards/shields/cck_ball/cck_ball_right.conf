CONFIG_SPI=y

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
# CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y
# CPI 800 com divisor 1.
# O divisor e aplicado como divisao INTEIRA sobre o valor bruto do sensor
# (pmw3610.c linha 629), entao qualquer deslocamento menor que o divisor
# vira zero. Com divisor 2, movimento lento era arredondado para nada:
# o log mostrou 69% das leituras com raw=0/0 e SQUAL entre 101 e 148,
# ou seja, o sensor enxergando perfeitamente e reportando zero.
CONFIG_PMW3610_CPI=800
CONFIG_PMW3610_CPI_DIVIDOR=1
# Orientacao confirmada por teste: o sensor esta montado girado 90 graus,
# entao o movimento horizontal aparece no eixo Y do valor bruto. A dupla
# ORIENTATION_270 + INVERT_X corrige isso corretamente - era a config
# original do vendedor, e esta certa.
CONFIG_PMW3610_ORIENTATION_270=y
CONFIG_PMW3610_SNIPE_CPI=200
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1
CONFIG_PMW3610_SCROLL_TICK=70
CONFIG_PMW3610_INVERT_X=y

# Polling: modo padrao do driver (250Hz por interrupcao).
# Antes: POLLING_RATE_125_SW (polling por software) - perdia amostras
CONFIG_PMW3610_POLLING_RATE_250=y

# Impede o sensor de entrar em modo de economia (REST1 apos 128ms parado),
# que causava o padrao rajada/silencio no movimento do cursor
CONFIG_PMW3610_FORCE_AWAKE=y

# SMART_ALGORITHM e para superficies tipo granito/azulejo, nao para bola de resina
CONFIG_PMW3610_SMART_ALGORITHM=n

# Acumula o deslocamento e reporta a cada 10ms em vez de a cada leitura.
# O sensor amostra a 250Hz; um relatorio por amostra significa 250 pacotes
# por segundo, que saturam a fila BLE e travam o cursor. Nada e perdido:
# o movimento acumulado sai inteiro no proximo relatorio.
CONFIG_PMW3610_REPORT_INTERVAL_MIN=10

# CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=250

# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ==== DIAGNOSTICO (branch diag-log) ====
# Habilita log serial por USB para inspecionar o driver PMW3610.
# O snippet studio-rpc-usb-uart foi removido do build.yaml nesta branch
# porque ocupa a mesma porta serial.
# Dependencias da serial USB (vinham do snippet studio-rpc-usb-uart,
# removido nesta branch): sem elas o ZMK_USB_LOGGING nao resolve
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y

CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_PMW3610_LOG_LEVEL_DBG=y
# Loga SQUAL (qualidade da superficie) e shutter a cada leitura
CONFIG_PMW3610_LOG_SURFACE_QUALITY=y
